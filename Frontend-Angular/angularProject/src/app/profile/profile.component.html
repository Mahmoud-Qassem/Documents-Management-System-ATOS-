<div class="auth-wrapper">
  <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
    <h2 class="auth-title">Update profile</h2>

    <div class="two-col">
      <label class="field">
        <span class="label">First name</span>
        <input class="input" formControlName="firstName" />
      </label>

      <label class="field">
        <span class="label">Last name</span>
        <input class="input" formControlName="lastName" />
      </label>
    </div>

    <label class="field">
      <span class="label">Email</span>
      <input class="input" formControlName="email" />
    </label>

    <label class="field">
      <span class="label">National ID</span>
      <input class="input" formControlName="nationalId" />
    </label>

    <label class="field">
      <span class="label">Password (optional)</span>
      <input class="input" type="password" formControlName="password" />
    </label>

    <label class="field">
      <span class="label">Mobile number</span>
      <input class="input" formControlName="mobileNumber" />
    </label>

    <label class="field">
      <span class="label">Address</span>
      <textarea class="input" formControlName="address"></textarea>
    </label>

    <div class="actions">
      <button class="btn" type="submit" [disabled]="loading">{{ loading ? 'Updating...' : 'Update' }}</button>
      <a class="link" routerLink="/dashboard">Back to dashboard</a>
    </div>

    <p class="submit-error" *ngIf="error">{{ error }}</p>
    <p class="submit-success" *ngIf="success">{{ success }}</p>
  </form>
</div>
