<div class="auth-wrapper">
  <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
    <h2 class="auth-title">Create account</h2>

    <div class="two-col">
      <label class="field">
        <span class="label">First name</span>
        <input class="input" formControlName="firstName" />
        <small class="error" *ngIf="form.get('firstName')?.touched && form.get('firstName')?.invalid">
          <span *ngIf="form.get('firstName')?.errors?.['required']">First name is required.</span>
          <span *ngIf="form.get('firstName')?.errors?.['minlength']">Minimum 3 characters.</span>
        </small>
      </label>

      <label class="field">
        <span class="label">Last name</span>
        <input class="input" formControlName="lastName" />
        <small class="error" *ngIf="form.get('lastName')?.touched && form.get('lastName')?.invalid">
          <span *ngIf="form.get('lastName')?.errors?.['required']">Last name is required.</span>
          <span *ngIf="form.get('lastName')?.errors?.['minlength']">Minimum 3 characters.</span>
        </small>
      </label>
    </div>

    <label class="field">
      <span class="label">Email</span>
      <input class="input" formControlName="email" />
    </label>

    <label class="field">
      <span class="label">National ID</span>
      <input class="input" formControlName="nationalId" />
    </label>

    <label class="field">
      <span class="label">Password</span>
      <input class="input" type="password" formControlName="password" />
    </label>

    <label class="field">
      <span class="label">Mobile number</span>
      <input class="input" formControlName="mobileNumber" />
    </label>

    <label class="field">
      <span class="label">Address</span>
      <textarea class="input" formControlName="address"></textarea>
    </label>

    <div class="actions">
      <button class="btn" type="submit" [disabled]="loading">{{ loading ? 'Creating...' : 'Create account' }}</button>
      <a class="link" routerLink="/login">Back to sign in</a>
    </div>

    <p class="submit-error" *ngIf="error">{{ error }}</p>
    <p class="submit-success" *ngIf="success">{{ success }}</p>
  </form>
</div>
