server.port=5000

# ----------- DATABASES ------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# RDS
spring.datasource.url=${RDS_URL}
spring.datasource.username=${RDS_USERNAME}
spring.datasource.password=${RDS_PASSWORD}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# MongoDB Atlas
spring.data.mongodb.uri=${MONGO_URI}

# ----------- AWS S3 ------------
aws.s3.bucket=${S3_BUCKET}
aws.s3.access-key=${S3_ACCESS_KEY}
aws.s3.secret-key=${S3_SECRET_KEY}
aws.s3.region=${S3_REGION}

# ----------- JWT ------------
dms.app.access.jwtSecret=${secretKey_1}
dms.app.refresh.jwtSecret=${secretKey_2}
dms.app.jwtExpirationMs=3600000
dms.app.jwtRefreshExpirationMs=86400000

# ----------- FILE UPLOADS ------------
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

preview.base64.threshold-bytes=5242880

# ----------- MONGO PAGINATION ------------
spring.data.mongodb.page-size=10

# enable ansi colors in console output
spring.output.ansi.enabled=ALWAYS






